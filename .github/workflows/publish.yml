name: Publish npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.8.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global "npm@^11.5.1"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package

      - name: Verify package versions and release tag
        run: |
          CORE_VERSION=$(node -p "require('./package.json').version")
          CREATE_VERSION=$(node -p "require('./packages/create-kudzu/package.json').version")
          test "v$CORE_VERSION" = "$RELEASE_TAG"
          test "$CORE_VERSION" = "$(node -p "require('./package-lock.json').version")"
          test "$CORE_VERSION" = "$(node -p "require('./package-lock.json').packages[''].version")"
          test "$CREATE_VERSION" = "$(node -p "require('./packages/create-kudzu/package-lock.json').version")"
          test "$CREATE_VERSION" = "$(node -p "require('./packages/create-kudzu/package-lock.json').packages[''].version")"

      - name: Publish @kudzujs/core
        run: |
          if npm view "@kudzujs/core@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "@kudzujs/core is already published"
          else
            npm publish --ignore-scripts
          fi

      - name: Publish create-kudzu
        working-directory: packages/create-kudzu
        run: |
          if npm view "create-kudzu@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "create-kudzu is already published"
          else
            npm publish --ignore-scripts
          fi

      - name: Verify published versions
        run: |
          verify() {
            for attempt in {1..12}; do
              test "$1" = "$(npm view "$2@$1" version 2>/dev/null)" && return
              sleep 5
            done
            echo "$2@$1 was not visible in the npm registry after 60 seconds"
            return 1
          }
          verify "$(node -p "require('./package.json').version")" "@kudzujs/core"
          verify "$(node -p "require('./packages/create-kudzu/package.json').version")" "create-kudzu"
