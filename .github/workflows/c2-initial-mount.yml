name: C2 initial mount attribution

on:
  push:
    branches:
      - perf/initial-mount-0174
      - perf/initial-cpu-0174

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUDZU_REQUIRE_CHROME: "1"
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node test/c2-initial-mount.mjs --cpu
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: c2-initial-mount-results
          path: c2-initial-mount-results
          if-no-files-found: warn
