name: C2 initial mount attribution

on:
  push:
    branches:
      - perf/initial-mount-0174
      - perf/initial-cpu-0174
      - perf/row-id-traversal-0174
      - perf/row-id-ownership-0174
      - perf/row-id-visits-0174
      - perf/resolved-row-ids-0174
      - fix/retained-row-events-0175
      - perf/initial-id-proof-0176
      - perf/attribute-bindings-0176
    # Pinned comparisons run when their harness changes, not on release-doc pushes.
    paths:
      - test/c2-initial-mount.mjs
      - .github/workflows/c2-initial-mount.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUDZU_REQUIRE_CHROME: "1"
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node test/c2-initial-mount.mjs ${{ github.ref_name == 'perf/attribute-bindings-0176' && '--attribute-bindings' || github.ref_name == 'perf/initial-id-proof-0176' && '--resolved-ids' || github.ref_name == 'fix/retained-row-events-0175' && '--row-events' || github.ref_name == 'perf/resolved-row-ids-0174' && '--effect-order' || github.ref_name == 'perf/row-id-visits-0174' && '--planned-ids' || github.ref_name == 'perf/row-id-ownership-0174' && '--row-ownership' || github.ref_name == 'perf/row-id-traversal-0174' && '--row-ids' || '--cpu' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: c2-initial-mount-results
          path: c2-initial-mount-results
          if-no-files-found: warn
