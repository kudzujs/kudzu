name: C2 conditional runtime validation

on:
  push:
    branches:
      - perf/condition-membership-0171

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KUDZU_REQUIRE_CHROME: "1"
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package
